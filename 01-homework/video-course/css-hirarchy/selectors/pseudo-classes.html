<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p::first-letter {
            color: orange;
        }

        p::first-line {
            font-style: italic;
        }
        
        p::selection {
            background-color: peachpuff;
        }

        p::before {
            content: "...";
        }

        p::after {
            content: " [show more]";
            color: blue;
        }
    </style>
</head>
<body>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis officia cupiditate, ab porro facilis sunt eveniet doloremque repudiandae molestiae incidunt adipisci ipsum excepturi voluptates hic minima ex odio laudantium. Quaerat?</p>
</body>
</html>
