<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="title">JavaScript is awesome<span style="display:none;"> — hidden text</span></h1>
    <h2 id="subtitle"></h2>

    <script>
        document.title = "Jacob Elcharar"
        const firstScript = document.body.getElementsByTagName('script')[0]
        console.dir(firstScript.src || firstScript.tagName);

        function introduce(greeting, name) {
            console.log(`${greeting} ${name}`);
        }

        introduce("Hi there", document.title)

        const title = document.getElementById('title')
        console.log(title);

        const subTitle = document.getElementById('subtitle')
        subTitle.innerText = title.innerText
        console.log(subTitle.innerText);

        /* the innerText gives only the text that appears to the user on the screen
           therfore the ' - hidden text' inside the span sets to 'displpay:none'
           wouldn't pass into the `subTitle.innertext` */

        subTitle.innerHTML = title.innerHTML
        console.log(subTitle.innerHTML) // innerHTML gives the whole title inner-content

        subTitle.textContent = title.textContent
        console.log(subTitle.textContent);

        subTitle.style.background = 'lightblue'
        subTitle.style.borderLeft = '4px solid orange'
    </script>
</body>

</html>
