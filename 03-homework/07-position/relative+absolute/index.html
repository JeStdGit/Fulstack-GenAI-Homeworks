<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .top-menu {
            position: sticky;
            top: 0;
            background-color: antiquewhite;
        }

        .parent {
            width: 300px;
            height: 300px;
            position: relative;
            background-color: aquamarine;
        }

        .child {
            width: 50px;
            height: 50px;
            bottom: 10px;
            left: 10px;
            position: relative;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="top-menu">Top Menu</div>
    <div class="parent">
        parent
        <div class="child">child</div>
    </div>
</body>
</html>
