<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box1, .box2 {
            width: 250px;
            padding: 30px;
            border: 10px solid black;
            box-sizing: content-box;
        }
        .box2 {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <p>
        The content-box is wider because the 250px are computed without the border (10px each side...) and the padding (30px each side)
    </p>
    <p>
        To sum up: box2 is shorter by 80px ((10*2)+(30*2) = 80)
    </p>
</body>
</html>
