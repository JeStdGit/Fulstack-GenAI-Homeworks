<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .article p {
            color: gold;
            background-color: rgb(255, 249, 214);
            padding: 5px 10px;
            border-radius: 30px;
            border: gainsboro solid 1px;
        }
        .article > p {
            font-size: x-large;
        }

        .article + p {
            color: cornflowerblue;
        }

        .article ~ p {
            color: teal;
        }
    </style>
</head>
<body>
    <div class="article">
        <p>Lorem ipsum dolor sit amet.</p>
        <div>
            <p>Lorem ipsum dolor sit amet.</p>
        </div>
    </div>
    <p>Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>
</body>
</html>
